name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Tipos y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci instala exactamente lo del package-lock.json y falla si ambos
      # se han desincronizado — eso también es una regresión que queremos cazar.
      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos (src)
        run: npx tsc --noEmit

      # api/ va aparte porque no lo compila Vite, lo ejecuta Node: necesita
      # `moduleResolution: NodeNext`, que aplica las reglas reales de ESM. Sin este
      # paso, un import sin `.js` pasaba el CI y tumbaba la función en producción
      # (incidente del 2026-09-13: 20 horas sin login).
      - name: Comprobar tipos (api)
        run: npx tsc -p tsconfig.api.json

      - name: Build
        run: npm run build
